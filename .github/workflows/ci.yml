name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history, so the submodules have the release tags their versions are read from.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The build runs CMake itself, so nothing installs these on demand.
      - name: Install the NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)" \
            "cmake;$(sed -n 's/^cmake = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
      - name: The Android library
        run: ./gradlew :koggopus:assembleAndroidMain
      - name: Hostile-input test under sanitizers
        run: |
          cmake -S native -B build/sanitize -DKOGG_BUILD_JNI=OFF -DKOGG_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -O1"
          cmake --build build/sanitize --target kogg_hostile --parallel
          build/sanitize/kogg_hostile
      # A short run on every push: it starts from the generated seeds each time, so it
      # catches regressions rather than exploring deeply. Longer runs are a local job.
      - name: Fuzz the decoder for a minute
        run: |
          cmake -S native -B build/fuzz -DKOGG_BUILD_JNI=OFF -DKOGG_BUILD_TESTS=ON -DKOGG_BUILD_FUZZER=ON \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -O1"
          cmake --build build/fuzz --target kogg_hostile kogg_fuzz --parallel
          mkdir -p build/fuzz/corpus build/fuzz/crashes
          build/fuzz/kogg_hostile --seeds build/fuzz/corpus
          build/fuzz/kogg_fuzz -dict=native/test/oggopus.dict -max_len=65536 -max_total_time=60 \
            -artifact_prefix=build/fuzz/crashes/ build/fuzz/corpus
      - name: Keep the input that broke the fuzzer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: build/fuzz/crashes/
          if-no-files-found: ignore

  # Builds the Linux libraries the way a release does, then runs the tests against them.
  linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history, so the submodules have the release tags their versions are read from.
          fetch-depth: 0
      - name: Build the libraries
        run: native/build-linux.sh ${{ matrix.arch }} build/natives
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The Arm image has no Android SDK, and Gradle cannot configure the project without one.
      - uses: android-actions/setup-android@v4
        if: matrix.arch == 'arm64'
      - name: Install the reference Opus tools
        run: sudo apt-get update && sudo apt-get install -y opus-tools
      - name: JVM tests
        run: ./gradlew :koggopus:jvmTest -Pkoggopus.prebuiltNatives=build/natives
      - name: Kotlin/Native tests
        if: matrix.arch == 'x64'
        run: ./gradlew :koggopus:linuxX64Test -Pkoggopus.prebuiltNatives=build/natives

  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history, so the submodules have the release tags their versions are read from.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The build runs CMake itself, so nothing installs these on demand.
      - name: Install the NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)" \
            "cmake;$(sed -n 's/^cmake = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: ./gradlew :koggopus:connectedAndroidDeviceTest :consumer-check:connectedMinifiedAndroidTest

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history, so the submodules have the release tags their versions are read from.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests on the iOS simulator, macOS and the JVM
        run: ./gradlew :koggopus:iosSimulatorArm64Test :koggopus:macosArm64Test :koggopus:jvmTest
