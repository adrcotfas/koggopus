name: Library releases

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Open an issue for each new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for path in $(git config -f .gitmodules --get-regexp '\.path$' | cut -d' ' -f2); do
            name=$(basename "$path")
            url=$(git config -f .gitmodules --get "submodule.$path.url" | sed "s/\.git$//")
            pinned=$(git ls-tree HEAD "$path" | awk '{print $3}')
            # Stable tags only, as "<sha> <tag>"; annotated tags resolve through their ^{} entry.
            tags=$(git ls-remote --tags "$url" | awk '{ sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2) } $2 ~ /^v[0-9.]*[0-9]$/ { print $1, $2 }' | sort -k2,2V -k1,1 -u)
            latest=$(echo "$tags" | tail -1 | cut -d' ' -f2)
            if echo "$tags" | grep -q "^$pinned $latest$"; then
              echo "$name: $latest is current"
              continue
            fi
            title="$name $latest is available"
            if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[].number')" ]; then
              echo "$name: issue for $latest already open"
              continue
            fi
            echo "$name: $latest is new"
            gh issue create --title "$title" --body "$url/releases/tag/$latest

          The submodule \`$path\` is at \`$pinned\`. To update it, check out \`$latest\` in the submodule and run the tests."
          done
