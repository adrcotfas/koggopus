name: Release

# Pushing a tag such as v0.1.0 uploads that version to Maven Central. The upload still
# has to be released by hand in the Central Portal.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The Linux libraries for the jvm jar; the Mac in the publish job builds the macOS ones.
  jvm-linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history, so the submodules have the release tags their versions are read from.
          fetch-depth: 0
      - name: Build the library
        run: native/build-jvm-linux.sh ${{ matrix.arch }} build/jvm-natives
      - uses: actions/upload-artifact@v7
        with:
          name: jvm-linux-${{ matrix.arch }}
          path: build/jvm-natives/
          if-no-files-found: error

  publish:
    needs: jvm-linux
    # macOS, because the iOS libraries can only be built there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history, so the submodules have the release tags their versions are read from.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The build runs CMake itself, so nothing installs these on demand.
      - name: Install the NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)" \
            "cmake;$(sed -n 's/^cmake = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
      - uses: actions/download-artifact@v8
        with:
          pattern: jvm-linux-*
          path: build/jvm-natives/
          merge-multiple: true
      - name: Install the reference Opus tools
        run: brew install opus-tools
      - name: Test
        run: ./gradlew :koggopus:jvmTest :koggopus:iosSimulatorArm64Test :koggopus:macosArm64Test
      - name: Publish
        run: >-
          ./gradlew :koggopus:publishToMavenCentral -PVERSION_NAME="${GITHUB_REF_NAME#v}"
          -Pkoggopus.prebuiltNatives=build/jvm-natives --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
